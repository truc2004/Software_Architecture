<!DOCTYPE html>
<html>
<head>
    <title>Function Partition</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2980b9;
        }

        .result {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Function Partition</h2>

    <input id="name" placeholder="Enter name">
    <input id="age" type="number" placeholder="Enter age">

    <button onclick="saveUser()">Save</button>

    <div class="result" id="result"></div>
</div>

<script>
    function getPartition(age) {
        return age < 20 ? "YOUNG" : "ADULT";
    }

    function saveUser() {

        let name = document.getElementById("name").value;
        let age = parseInt(document.getElementById("age").value);

        if (!name || !age) {
            alert("Nhập đầy đủ dữ liệu!");
            return;
        }

        let partition = getPartition(age);

        let data = {
            name: name,
            age: age
        };

        console.log("DATA:", data);

        fetch("/users", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
            .then(res => res.text())
            .catch(err => {
                console.error(err);
                alert("Lỗi rồi!");
            });
    }
</script>

</body>
</html>
