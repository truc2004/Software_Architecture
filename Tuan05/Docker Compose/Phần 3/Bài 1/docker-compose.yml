services:
  wordpress:
    image: wordpress:latest
    container_name: wp_app
    restart: unless-stopped
    ports:
      - "8080:80"   # Truy cập WordPress qua http://localhost:8080
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
    depends_on:
      - db
    volumes:
      - ./wp_data:/var/www/html
    networks:
      - wp_network

  db:
    image: mysql:5.7
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: wp_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_pass
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - wp_network

# Named volumes (Docker sẽ tự tạo nếu chưa có)
volumes:
  db_data:
  wp_data:

# Network riêng cho stack
networks:
  wp_network:
    driver: bridge