services:
  vote:
    build: ./vote
    container_name: vote
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - voting_net

  result:
    build: ./result
    container_name: result
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    networks:
      - voting_net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - voting_net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - voting_net

networks:
  voting_net:
    driver: bridge

volumes:
  postgres_data: